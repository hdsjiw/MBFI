spring:
  application:
    name: mbfi-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mbfi}
    username: ${POSTGRES_USER:mbfi}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:db/schema.sql
server:
  port: ${BACKEND_PORT:8080}
app:
  ai-base-url: ${AI_BASE_URL:http://localhost:8000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  payment:
    amount: ${REPORT_PRICE:9900}
    toss-base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
    toss-secret-key: ${TOSS_SECRET_KEY:}
    access-token-ttl-hours: ${ACCESS_TOKEN_TTL_HOURS:24}
